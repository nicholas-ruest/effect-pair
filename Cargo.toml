[package]
name = "effect-pair"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fail-closed comparison of baseline and candidate sandbox side-effect traces"
license = "MIT"
repository = "https://github.com/nicholas-ruest/effect-pair"
readme = "README.md"
keywords = ["sandbox", "trace", "ci", "security", "diff"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
globset = "0.4.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
toml = "0.9.8"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[profile.release]
lto = "thin"
strip = true
